# Copy to config.yaml (ignored by git) and change what you need.

camera:
  source: opencv      # opencv = laptop or USB webcam, picamera2 or rpicam = Pi Camera Module
  index: 0            # which webcam when there is more than one
  width: 640
  height: 480

vision:
  model_path: models/face_landmarker.task
  calibration_s: 3    # seconds to learn the user's normal working pose
  thresholds:
    ear_closed: 0.15        # eyes closed below this EAR (only before calibration)
    ear_closed_ratio: 0.6   # after calibration: closed under 60% of the user's own open eyes
    gaze_off: 0.20
    smoothing_s: 0.15       # averages the numbers over this long so they don't flicker (0 = off)
    yaw_deg: 30
    pitch_deg: 20
    roll_deg: 30
    eyes_closed_after_s: 3
    distracted_after_s: 5
    away_after_s: 8
    recover_after_s: 1
    grace_s: 0.5

api:
  base_url: http://localhost:8080/api/v1   # on the Pi: the laptop's IP, e.g. http://192.168.43.20:8080/api/v1
  poll_s: 3           # seconds between "is there a session?" checks
  # No robot_id any more: the robot pairs with a code shown on its screen, and saves its id
  # and tokens in ~/.kaboom_robot/device_tokens.json.
  # serial_number: ""  # optional; default is the Pi's own serial (python -m kaboom_robot.device_id)
spring.application.name=Kaboom

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kaboom_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Production sets JWT_SECRET; the value after ":" is for local development only.
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}
# Behind a proxy (Railway), read the real https address from the X-Forwarded-* headers.
# Without it the web app's own API calls look like another site and CORS answers 403.
server.forward-headers-strategy=framework

logging.level.org.springframework.security=FALSE
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
